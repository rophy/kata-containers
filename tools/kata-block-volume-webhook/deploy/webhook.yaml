---
apiVersion: v1
kind: Namespace
metadata:
  name: kata-webhook
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kata-block-volume-webhook
  namespace: kata-webhook
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kata-block-volume-webhook
rules:
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kata-block-volume-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kata-block-volume-webhook
subjects:
- kind: ServiceAccount
  name: kata-block-volume-webhook
  namespace: kata-webhook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kata-block-volume-webhook
  namespace: kata-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kata-block-volume-webhook
  template:
    metadata:
      labels:
        app: kata-block-volume-webhook
    spec:
      serviceAccountName: kata-block-volume-webhook
      containers:
      - name: webhook
        image: kata-block-volume-webhook:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8443
        env:
        - name: TLS_CERT_FILE
          value: /etc/webhook/certs/tls.crt
        - name: TLS_KEY_FILE
          value: /etc/webhook/certs/tls.key
        volumeMounts:
        - name: certs
          mountPath: /etc/webhook/certs
          readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 5
      volumes:
      - name: certs
        secret:
          secretName: kata-block-volume-webhook-tls
---
apiVersion: v1
kind: Service
metadata:
  name: kata-block-volume-webhook
  namespace: kata-webhook
spec:
  selector:
    app: kata-block-volume-webhook
  ports:
  - port: 443
    targetPort: 8443
---
# PVC webhook: mutate volumeMode for PVCs with kata.io/block-passthrough label
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: kata-block-volume-pvc
webhooks:
- name: pvc.kata-block-volume.io
  admissionReviewVersions: ["v1"]
  sideEffects: None
  clientConfig:
    service:
      name: kata-block-volume-webhook
      namespace: kata-webhook
      path: /mutate-pvc
    caBundle: ${CA_BUNDLE}
  rules:
  - apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["persistentvolumeclaims"]
    operations: ["CREATE"]
  # Only trigger for PVCs with the block-passthrough label
  objectSelector:
    matchLabels:
      kata.io/block-passthrough: "true"
  failurePolicy: Ignore
---
# Pod webhook: convert volumeMounts to volumeDevices for Kata pods
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: kata-block-volume-pod
webhooks:
- name: pod.kata-block-volume.io
  admissionReviewVersions: ["v1"]
  sideEffects: None
  clientConfig:
    service:
      name: kata-block-volume-webhook
      namespace: kata-webhook
      path: /mutate-pod
    caBundle: ${CA_BUNDLE}
  rules:
  - apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
    operations: ["CREATE"]
  failurePolicy: Ignore
